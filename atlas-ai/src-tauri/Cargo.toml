[package]
name = "atlas"
version = "1.1.0"
description = "Atlas desktop app"
authors = ["Rehan Islam"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
reqwest = { version = "=0.13.3", default-features = false, features = ["blocking", "json"] }
